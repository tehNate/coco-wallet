plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.companycoin.wallet'
    compileSdk 34

    buildFeatures {
        viewBinding true
    }

    defaultConfig {
        applicationId "com.companycoin.wallet"
        minSdk 24
        targetSdk 34
        versionCode 5
        versionName "2.0.2"
    }

    signingConfigs {
        release {
            storeFile file(System.getenv("COCO_STORE_FILE") ?: "coco-release-key.jks")
            storePassword System.getenv("COCO_STORE_PASSWORD")
            keyAlias System.getenv("COCO_KEY_ALIAS")
            keyPassword System.getenv("COCO_KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DISCLAIMER', 'META-INF/io.netty.versions.properties']
            pickFirsts += ['META-INF/NOTICE.md', 'META-INF/LICENSE.md']
        }
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation project(':wallet-core')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.10.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity:1.8.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'

    // OkHttp
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // Security / Biometrics
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.security:security-crypto:1.0.0'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'com.google.zxing:core:3.5.2'
    implementation ('org.web3j:core:4.12.0') { exclude group: 'org.bouncycastle' }
}
